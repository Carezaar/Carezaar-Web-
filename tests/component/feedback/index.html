<!doctype html><html><head><title>Private feedback component fixture</title></head><body><div id="root"></div><script>
const active4500=new Map(),history4500=[];
const originalSet=window.setTimeout.bind(window),originalClear=window.clearTimeout.bind(window);

</script><script src="fixture.js"></script></body></html>
